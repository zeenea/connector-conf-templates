name = ""
code = ""
connector_id = "databricks-v2"
enabled = true

# Define the catalog code associated with the connection ("default" when empty).
# catalog_code = ""

# Defines the list of aliases used by other connectors to generate lineage link.
# alias = ["localhost:1234/db","https://some-url.org"]

# Define secret manager for this connection. 
# This configuration only works with Scanner 73+ and needs a functional secret manager configured in the scanner configuration file.
#secret_manager {
#    enabled = true
#    key = "<secret_name>"
#}

connection {
  url = ""
  # The HTTP path part of the JDBC connection to retrieve User defined tags
  # jdbc:databricks://<hostname>:<port>/default;transportMode=http;ssl=1;AuthMech=11;Auth_Flow=1;httpPath=<httpPath>;
  # ex: http_path = "/sql/1.0/warehouses/<id>"
  http_path = ""

  oauth {
    client_id = ""
    client_secret = ""

    # Optional - OAuth2 endpoint (example: "https://<tenant>.cloud.databricks.com/oidc/v1/token")
    endpoint = 
    # Optional - OAuth2 scope (example: "all-apis")
    scope = 
  }
}

# Activate lineage (true/false)
# Will be refactored in next RC
lineage.enabled = ""


# User-defined tags are fetched via JDBC against Unity Catalog information_schema views
# (the Databricks REST API has no tag endpoints).
#
# Prerequisites when enabling:
#   1. Set connection.http_path above.
#   2. Grant the service principal "Can use" or "Can run" on the SQL warehouse.
#   3. For each catalog, grant SELECT on the tag views:
#        GRANT SELECT ON `<catalog>`.information_schema.table_tags  TO `<service_principal>`;
#        GRANT SELECT ON `<catalog>`.information_schema.column_tags TO `<service_principal>`;
#
# If connection.http_path is missing or the service principal lacks warehouse access,
# tags are silently skipped and a warning is logged.
#
# Activate or desactivate user User defined tags (true/false), default false
# Will be refactored in next RC
user_defined_tags.enabled = ""


