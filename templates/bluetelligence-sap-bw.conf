name = ""
code = ""
connector_id = "bluetelligence-sap-bw"
enabled = true

connection {
    # The output folder of the Bluetelligence extractor. The connector reads the XML files found in it
    # (Details, Buildups, BuildupDescriptions, Relations, Mappings).
    # Use an absolute path and one folder per connection.
    # Always set it: a blank value resolves to the scanner working directory, and when the key is omitted
    # the connector falls back to the folder "Export", relative to the scanner working directory.
    # Mandatory
    path = ""

    synchronize {
        # The command (with all parameters) that runs the Bluetelligence extractor and writes its files
        # into "connection.path".
        # For example under Unix: /opt/bluetelligence/DataLineage.sh extract-all -s A4H
        # When empty or not set, nothing is run and the connector reads the files already present in
        # "connection.path". Existing files are never removed by the connector.
        # Do not put secrets in the command line.
        # Optional
        # cmd = ""

        # Timeout of the extractor command, in seconds.
        # Default: 300
        # Optional
        # timeout = 300
    }
}

# The language code used to retrieve the desired description from the files. Default to "E" (English).
# Example: Setting description_language = "E" will match the language attribute
# and retrieve the text "Purchasing Document Type" from the tag:
# <description language="E" text="Purchasing Document Type" />
description_language = "E"


# Filter used to keep only items that matches this filter.
#
# Use universal filter language described in documentation.
# https://docs.actian.com/data-intelligence-platform/technical-documentation/scanners/zeenea-universal-filters.html
#
# Rules filter keys are :
# - "Technical Name" : Name of entity
# - UID              : UUID of entity
# - Type             : Type of entity
# - "Info Area"      : The info area attach to the entity

#
# Example:
#filters = [
#  {
#    id="accept_zeenea_dataset"
#    action = ACCEPT
#    rules {
#      "Info Area" = "Zeenea"
#    }
#  },
#  {
#    id = "default_reject"
#    action = REJECT
#  }
#]
#
# filters = []
