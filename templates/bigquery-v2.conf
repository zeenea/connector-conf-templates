name = ""
code = ""
connector_id = "bigquery-v2"
enabled = true

# This connector requires Scanner 102+

# Define the catalog code associated with the connection ("default" when empty).
# catalog_code = ""

# Defines the list of aliases used by other connectors to generate lineage link.
# alias = ["localhost:1234/db","https://some-url.org"]

# Define secret manager for this connection.
# This configuration needs a functional secret manager configured in the scanner configuration file.
#secret_manager {
#    enabled = true
#    key = "<secret_name>"
#}

connection {
    # JSON key either as an embedded raw value (use triple quotes """{ "json": "here" }""")
    # or as a file, by setting an absolute file URL (e.g. file:///etc/bigquery/zeenea-key.json)
    json_key = ""

    # Identifier of the project to scan.
    # When empty, every project the service account can find is scanned.
    # project_id = ""

    # Identifier of the project used to create the BigQuery client. Query jobs (view sampling) are billed to this project.
    # When empty, each scanned project uses its own client.
    # billing_project_id = ""
}

# Pattern (Java regex) of the varying part of table names in multi-table datasets.
#
# Every match in a table name is replaced by a star "*".
#
# So if the BigQuery dataset contains the tables:
#   - log_cogip_2020_05_30,
#   - log_cogip_2020_06_01,
#   - log_acme_2020_06_03,
#   - log_acme_2020_06_04,
#   - x_files_01,
#   - x_files_02,
#
# and inventory.partition.pattern contains the value "\\d{4}_\\d{2}_\\d{2}$|\\d{2}$"
# the inventory will find the zeenea datasets:
#   - log_cogip_*,
#   - log_acme_*,
#   - x_files_*.
#
# inventory.partition.pattern = ""

# sampling {
#     view {
#         # Enable data sampling of views and materialized views (runs a query job).
#         # Default value: false
#         enabled = false
#
#         # For simple views (single FROM, no JOIN/UNION/GROUP BY/subquery),
#         # sample the source table with TABLESAMPLE SYSTEM instead of SELECT * ... LIMIT.
#         # Default value: false
#         simple_view_optimization = false
#     }
# }

# lineage {
#     # Lineage strategy (one value; the two strategies cannot be combined):
#     #   - data_lineage_api       : dataset-level lineage from the Google Data Lineage API (default)
#     #   - data_lineage_streaming : dataset-level and field-to-field lineage from the
#     #                              Google Data Lineage API (SearchLineageStreaming)
#     # Both require the roles/datalineage.viewer role on each scanned project and on every
#     # project that runs jobs writing the scanned tables (lineage is stored under the job's project).
#     # Field-level links with data_lineage_streaming additionally need the
#     # datalineage.events.getFields permission.
#     strategy = "data_lineage_api"
# }

# Filters used to keep only items that match them.
#
# Use universal filter language described in documentation.
# https://docs.actian.com/zeenea/#page/Technical%20Documentation/zeenea-universal-filters.html
#
# Rules filter keys are :
# - project : BigQuery project id
# - dataset : BigQuery dataset name
#
# Two independent scopes:
# - inventory_filters : applied to inventory
# - sampling_filters  : applied to data sampling
#
# Example:
# inventory_filters = [
#  {
#    id = "reject_staging_dataset"
#    action = REJECT
#    rules {
#      project = "my-project"
#      dataset = "staging"
#    }
#  },
#  {
#    id = "default_accept"
#    action = ACCEPT
#  }
# ]
#
# sampling_filters = [
#  {
#    id = "no_sampling_on_pii_dataset"
#    action = ACCEPT
#    rules {
#      dataset = "pii"
#    }
#    sampling = false
#  },
#  {
#    id = "default_accept"
#    action = ACCEPT
#  }
# ]
#
# Each scope falls back to the legacy "filters" key when absent.

