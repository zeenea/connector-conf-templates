name = ""
code = ""
connector_id = "google-dataplex-v2"
enabled = true

# This connector requires Scanner 102+

# Define the catalog code associated with the connection ("default" when empty).
# catalog_code = ""

# Defines the list of aliases used by other connectors to generate lineage link.
# alias = ["localhost:1234/db","https://some-url.org"]

# Define secret manager for this connection. 
# This configuration only works with Scanner 73+ and needs a functional secret manager configured in the scanner configuration file.
#secret_manager {
#    enabled = true
#    key = "<secret_name>"
#}

connection {
    # JSON key either as an embedded raw value (use triple quotes """{ "json: "here" }""")
    # Or as a file by setting a absolute file URL (e.g. file:///etc/dataplex/zeenea-key.json)
    json_key = ""
}

# At least one project_id and location_id should be set.
scope {
    # Configure project list to scan (a list of project_id separated by comma)
    project_id = ""
	
	# Configure location id from GCP (only 1 location id is supported)
    # GCP cloud region list : https://cloud.google.com/compute/docs/regions-zones#available
    location_id = ""
}

# lineage {
#     # Lineage strategy (one value):
#     #   - process_crawl : once per project and location in each extraction request, reads every
#     #                     lineage process, its last run and that run's lineage events (default)
#     #   - search_links  : reads the lineage of each item with one search on the
#     #                     Google Data Lineage API (searchLinks)
#     # Both are covered by the roles/datalineage.viewer role on each scanned project.
#     # process_crawl needs datalineage.processes.list, datalineage.runs.list and
#     # datalineage.events.list. It only reads the scanned projects, so lineage written by jobs
#     # running in another project is missing.
#     # search_links needs datalineage.locations.searchLinks and datalineage.events.get, also on
#     # every project that runs jobs writing the scanned tables (lineage is stored under the job's
#     # project). Without datalineage.events.get, no lineage is returned and no error is logged.
#     strategy = "process_crawl"
# }

# Filter used to keep only items that match this filter.
#
# Use universal filter language described in documentation.
# https://docs.actian.com/data-intelligence-platform/technical-documentation/scanners/zeenea-universal-filters.html
#
# Rules filter keys are :
# - entry_group   : Dataplex Entry Group (@bigquery)
# - project       : Dataplex Entry project
# - dataset       : Dataplex Entry dataset
# - table         : Dataplex Entry table
#
# Example:
#filters = [
#  {
#    id="accept_zeenea_dataset"
#    action = ACCEPT
#    rules {
#      dataset = "ZEENEA*"
#    }
#  },
#  {
#    id = "default_reject"
#    action = REJECT
#  }
#]
#
# filters = []

# proxy {
