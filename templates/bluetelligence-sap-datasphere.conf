name = ""
code = ""
connector_id = "bluetelligence-sap-datasphere"
enabled = true

connection {
    # The output folder of the Bluetelligence extractor. The connector reads every .xml file found in it
    # (Details, Buildups, BuildupDescriptions, Relations).
    # Use one folder per connection: two Datasphere tenants must not share a folder.
    # There is no default folder.
    # Mandatory
    path = ""

    synchronize {
        # The command (with all parameters) that runs the Bluetelligence extractor and writes its files
        # into "connection.path".
        # For example under Unix: /opt/bluetelligence/<EXTRACTOR_COMMAND> <EXTRACTOR_PARAMETERS>
        # When empty or not set, nothing is run and the connector reads the files already present in
        # "connection.path".
        # Optional
        # cmd = ""

        # Timeout of the extractor command, in seconds.
        # Default: 300
        # Optional
        # timeout = 300
    }
}
