name = ""
code = ""
connector_id = "sqlserver-v2"
enabled = true

# Define secret manager for this connection.
# Requires a functional secret manager configured in the scanner configuration file.
#secret_manager {
#    enabled = true
#    key = "<secret_name>"
#}

connection {
    # JDBC URL
    # See: https://docs.microsoft.com/en-us/sql/connect/jdbc/building-the-connection-url
    url = ""
    username = ""
    password = ""

    # Windows authentication (Scanner running on Windows only)
    #
    # Instead of username and password, the Scanner can connect with the identity of the Windows account
    # running the Scanner service (see documentation for prerequisites).
    # To use it, add "integratedSecurity=true" to the URL and comment out username and password.
    #
    # Example:
    # url = "jdbc:sqlserver://<host>:1433;integratedSecurity=true;encrypt=true;"
}

# Filters
# See: https://docs.actian.com/data-intelligence-platform/technical-documentation/scanners/universal-filters.html
#
# The three Filter types share an identical structure.
# inventory_filters = []
# sampling_filters = []
# profiling_filters = []
#
# Example:
#inventory_filters = [
#  {
#    id = "accept_some_tables""
#    action = ACCEPT
#    rules {
#      catalog = "glob:testdb"
#      schema = "glob:demo*"
#      table = "regex:tbl_.*"
#    }
#  },
#  {
#     id = "default_reject"
#     action = REJECT
#  }
#]

lineage {
    # Enable lineage for Views (enabled by default)
    #view.enabled = true

    # Enable lineage for Procedures (disabled by default).
    # If enabled, Procedures that reference an imported Table are automatically included in the import.
    #storedproc.enabled = false
}
