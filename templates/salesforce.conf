code = ""
name = ""
connector_id = "salesforce"
enabled = true

# Salesforce API Credentials
# Follow the Salesforce documentation : https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/authenticate-soap-api.html#authenticate-with-usernametoken

connection {
    # The authentication type, either password or jwt
    auth_type = password
    # The username of your Salesforce account
    username = ""
    # The password of your Salesforce account, if your auth_type is password
    password = ""
    # The created token of your Salesforce account, if your auth_type is password
    token = ""
    # Either
    # - https://login.salesforce.com/services/Soap/u/64.0 for a classic production environment
    # - https://test.salesforce.com/services/Soap/u/64.0 for a sandbox
    # - https://<your-domain>.my.salesforce.com/services/Soap/u/64.0 if your organization enforces a My Domain login
    endpoint = ""

    # This section is only if auth_type is jwt
    jwt {
        # The consumer key of your external application in Salesforce
        client_id = ""
        # The private key path associated with your external application
        private_key_path = ""
        # Optional - if your private key is encrypted, the passphrase of this key
        private_key_passphrase = ""
    }
}

inventory {
    # List of items to explicitly include in the inventory
    # Default : ""
    # Example : "Account,ServiceContract,ContractLineItem"
    # additional_objects =

    # Item prefix to explicitly include items in the inventory
    # Default : ""
    # Example : "prefix1_,prefix2_"
    # managed_prefixes =

    # Include Salesforce audit fields (CreatedById, CreatedDate, LastModifiedById, LastModifiedDate)
    # Default : false
    # audit_fields =

    # Include Salesforce system fields (ConnectionReceivedId, ConnectionSentId, IsDeleted, LastReferencedDate, LastViewedDate, MasterRecordId, SystemModstamp)
    # Default : false
    # system_fields =

    # Include custom fields
    # Default : true
    # custom_fields =

    # Include object ending with __c
    # Default : true
    # custom_objects =
}